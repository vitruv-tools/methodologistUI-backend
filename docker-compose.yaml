version: '2.2'

services:
  methodologist:
    build: target
    image: "Methodologist:${DOCKER_TAG:-latest}"
    ports:
      - '8787:8787'
      - '5027:5027'
    environment:
      JAVA_OPTIONS: >-
        -Xmx1024m
        -Xdebug
        -Dspring.profiles.active=docker
      JAVA_TOOL_OPTIONS:
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    volumes:
      - ${PWD}/app/log:/app/log
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:$${SERVER_PORT:-8080}/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      methodologist-postgresdb:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  methodologist-flyway:
    image: flyway/flyway
    command: -url=jdbc:postgresql://methodologist-postgresdb/methodologist -schemas=public -user=methodologist -password=methodologist -connectRetries=60 migrate
    volumes:
      - ${PWD}/src/main/resources/db/migration:/flyway/sql
    depends_on:
      - methodologist-postgresdb

  methodologist-postgresdb:
    image: postgres:17.2-alpine
    ports:
      - '3454:5432'
    environment:
      POSTGRES_USER: methodologist
      POSTGRES_PASSWORD: methodologist
      POSTGRES_DB: methodologist
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U methodologist -d methodologist"]
      interval: 5s
      timeout: 5s
      retries: 20

  mock-server:
    image: mockserver/mockserver:5.14.0
    command: -logLevel DEBUG -serverPort 1080
    ports:
      - '1080:1080'
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/initializer_expectations.json
    volumes:
      - ./component-test/features/expectations/:/config/

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    environment:
      JAVA_OPTS: >-
        -server -Xms64m -Xmx512m -XX:MetaspaceSize=96M -XX:MaxMetaspaceSize=256m
        -Djava.net.preferIPv4Stack=true
        -Dkeycloak.profile.feature.admin_fine_grained_authz=enabled
        -Dkeycloak.profile.feature.token_exchange=enabled

      DB_ADDR: keycloak-db
      DB_USER: keycloak
      DB_PASSWORD: keycloak
      DB_VENDOR: postgres
      DB_DATABASE: keycloak
      DB_PORT: "5139"

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - '7668:8080'
    command:
      - start-dev
      - --import-realm
    healthcheck:
      # The image ships neither curl nor wget; bash's /dev/tcp reaches the management port
      # (9000, enabled by KC_HEALTH_ENABLED) from inside the container. /health/ready answers
      # 200 when ready and 503 otherwise, so the status line is what counts.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q 'HTTP/1.1 200' <&3
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      keycloak-db:
        condition: service_healthy
    volumes:
      - ./docker/keycloak:/tmp
      - ./docker/keycloak/themes/test:/opt/jboss/keycloak/themes/test

  keycloak-db:
    image: postgres:17.2-alpine
    ports:
      - '5637:5432'
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20