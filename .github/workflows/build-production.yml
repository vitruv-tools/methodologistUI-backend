name: Build - Production Image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build-prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Set image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # A release must pass its tests, so they are not skipped here.
      - name: Build backend jar
        run: ./mvnw --batch-mode --no-transfer-progress -pl app -am clean package

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile copies app.jar from the build context, so the context is app/target.
      # The frontend image is built in the frontend repository.
      - name: Build backend image
        run: |
          docker build -f Dockerfile -t ghcr.io/$IMAGE_NAME/backend:$TAG app/target
          docker push ghcr.io/$IMAGE_NAME/backend:$TAG
