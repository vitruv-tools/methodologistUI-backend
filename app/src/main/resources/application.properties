spring.profiles.active=dev
websocket.max-buffer-size=262144

###############################################################################
# Actuator (applies to every profile)
###############################################################################
# Only these endpoints exist over HTTP; env, beans, heapdump etc. stay closed.
management.endpoints.web.exposure.include=health,info
# /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# Anonymous callers only see the status; authenticated users see each component.
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
# Readiness covers what the backend cannot serve requests without. Liveness stays
# on the JVM's own state so an upstream outage never gets the container restarted.
management.endpoint.health.group.readiness.include=readinessState,db,keycloak,setupService
management.info.git.mode=simple
# Timeout of the Keycloak and setup-service health probes
health.upstream.timeout=3s
