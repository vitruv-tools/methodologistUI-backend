spring.profiles.active=dev
websocket.max-buffer-size=262144

###############################################################################
# Actuator (applies to every profile)
###############################################################################
# Only these endpoints exist over HTTP; env, beans, heapdump etc. stay closed.
management.endpoints.web.exposure.include=health,info
# /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
# Anonymous callers only see the status; authenticated users see each component.
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
# Readiness covers what the backend cannot serve requests without. Liveness stays
# on the JVM's own state so an upstream outage never gets the container restarted.
management.endpoint.health.group.readiness.include=readinessState,db,keycloak,setupService
management.info.git.mode=simple
# Timeout of the Keycloak and setup-service health probes
health.upstream.timeout=3s

# PostgreSQL puts the values of a violated constraint into its error messages, e.g. an email in
# "Key (email)=(...) already exists"; without the detail, messages and logs name only the constraint.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# Hibernate logs every failed SQL statement at WARN and ERROR, including constraint violations the
# API answers with 409. GlobalExceptionHandlerController logs these exceptions at the right level.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
