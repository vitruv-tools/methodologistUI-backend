# Runs the VSUM application in a container.
#
#   docker compose up --build -d      build the image and start the application
#   docker compose logs -f            follow its log
#   docker compose down               stop it (add -v to also delete the stored models)
#
# The application is then reachable at http://localhost:8080 (or the port set in VSUM_PORT).
services:
  vsum:
    build: .
    ports:
      # Change the host port with `VSUM_PORT=9000 docker compose up`.
      - "${VSUM_PORT:-8080}:8080"
    volumes:
      - vsum-data:/data
    environment:
      # JVM options are picked up automatically, e.g. to raise the heap limit.
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx1g}
    restart: unless-stopped

volumes:
  vsum-data:
